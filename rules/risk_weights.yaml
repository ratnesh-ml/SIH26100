version: "1.0"
description: "Transparent risk weight point allocations and anomaly signal definitions for VigilBid evaluation"

weights:
  compliance_findings:
    hard_fail: 25        # Cap 50 points
    hard_fail_cap: 50
    review_finding: 8    # Cap 24 points
    review_finding_cap: 24
    warn_finding: 3      # Cap 12 points
    warn_finding_cap: 12

  entity_resolution:
    low_confidence_below_60: 20
    moderate_confidence_60_to_85: 10

  identity_and_verification:
    pan_gstin_mismatch: 25
    government_registry_failure: 25
    medium_claiming_mse_exemption: 20
    unverified_debarment_match: 35

  documentation_and_dates:
    missing_mandatory_document: 10
    expired_certificate_on_due_date: 15
    oem_validity_expired: 15

  cross_document_contradictions:
    udyam_gstin_identifier_conflict: 20
    turnover_statement_inconsistency: 15

  forensic_anomalies:
    A_PDF_01_metadata_date_anomaly: 6
    A_PDF_02_incremental_updates_xref: 8
    A_PDF_03_producer_mismatch_image_editor: 6
    A_PDF_04_text_layer_ocr_mismatch: 12
    A_PDF_05_font_subset_mismatch: 5
    A_INJ_01_prompt_injection_signal: 20

  cross_bidder_collusion:
    A_XB_01_shared_pdf_metadata: 10
    A_XB_02_shared_contact_bank_director: 15
    A_XB_03_near_duplicate_text: 10

bands:
  low:
    min: 0
    max: 24
    label: "LOW"
    description: "Standard risk profile — standard verification routine"
  medium:
    min: 25
    max: 54
    label: "MEDIUM"
    description: "Elevated risk signals — officer verification required on flagged drivers"
  high:
    min: 55
    max: 100
    label: "HIGH"
    description: "Substantial risk signals — thorough human review required before qualification"
