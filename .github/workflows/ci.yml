name: VigilBid Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vigilbid
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/vigilbid"
      DATABASE_SYNC_URL: "postgresql://postgres:postgres@localhost:5432/vigilbid"
      SECRET_KEY: "vigilbid-ci-secret-key-for-automated-testing-64-characters-minimum"
      FERNET_KEY: "uE_3m_9sF9yKz6T-Yh1N9P0wZ7vL5k4j2h1g8f7e6d4="
      ENVIRONMENT: "testing"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Compile Frontend Distribution for Audit
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Run Database Migrations & Demo Seeding
        run: |
          alembic upgrade head
          python scripts/demo_setup.py --seed-only

      - name: Run Backend Pytest Suite
        run: |
          pytest tests/ -v

      - name: Run Automated Release Audit
        run: |
          python scripts/release_audit.py

  frontend-test:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest & UI Integrity Checks
        run: |
          cd frontend
          npm test

      - name: Compile Frontend Production Bundle
        run: |
          cd frontend
          npm run build
